name: Build & Deploy (Middleman → GitHub Pages & S3)

on:
  push:
    branches: ["main", "integration"]
    paths-ignore:
      - "README.md"
  pull_request:
    branches: ["integration"]
    types: [opened, synchronize, reopened, ready_for_review, closed]
    paths-ignore:
      - "README.md"
permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  # # pull-requests: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build site
        run: bundle exec middleman build --clean

      - name: Fix CSS absolute asset URLs for subpath hosting
        run: |
          PREFIX="/gcgs-cdp-documentation"

          # Only CSS url() - handle url("/..."), url('/...'), url(/...)
          find build -type f -name "*.css" -print0 | xargs -0 sed -i \
            -e "s|url(/|url($PREFIX/|g" \
            -e "s|url(\"/|url(\"$PREFIX/|g" \
            -e "s|url('/|url('$PREFIX/|g"

      - name: Upload Pages artifact (main only)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Upload build artifact for S3 (integration only)
        if: github.ref == 'refs/heads/integration'
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: build
          if-no-files-found: error

  # -----------------------------
  # Deploy main → GitHub Pages
  # -----------------------------
  deploy_pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # -----------------------------
  # Deploy integration push → S3
  # -----------------------------
  deploy_s3:
    if: github.ref == 'refs/heads/integration'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-build
          path: site

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync site "s3://${{ secrets.S3_BUCKET }}/integration/*" --delete
  
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug event
        run: 'echo "Event: ${{ github.event_name }}"'

  # ---------------------------------
  # PR Preview Deploy → S3
  # ---------------------------------
  pr_preview_deploy:
    if: github.event_name == 'pull_request' && github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Build site
        run: bundle exec middleman build --clean

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy PR preview
        run: |
          PR="${{ github.event.pull_request.number }}"
          aws s3 sync build "s3://${{ secrets.S3_BUCKET }}/integration/pr${PR}/" --delete

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_BASE_URL: ${{ secrets.PREVIEW_BASE_URL }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const url = `${process.env.PREVIEW_BASE_URL}/integration/pr${prNumber}/`;
            const marker = '<!-- pr-preview-url -->';
            const body = `${marker}
            ✅ **Preview deployed**
            - ${url}
            `;

            const { owner, repo } = context.repo;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100
            });

            const existing = comments.find(c => c.user?.type === 'Bot' && c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body
              });
            }

